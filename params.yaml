# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4             # эффективный батч = 8: память как у батча 2, шаг как у батча 8
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 2
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  prompts:
    - "Тема:\nIT Support: диагностика проблем с ОС\n\nВопрос:\nПользователь жалуется, что компьютер включается, но экран остаётся чёрным. Первое действие для диагностики\n\nВарианты ответа:\n0. переустановить операционную систему\n1. проверить подключение монитора и кабель питания\n2. заменить блок питания\n3. обновить драйверы видеокарты"
    - "Тема:\nIT Support: проблемы с программным обеспечением\n\nВопрос:\nПриложение запускается и сразу закрывается без сообщения об ошибке. Наиболее вероятная причина\n\nВарианты ответа:\n0. несовместимость версии библиотеки\n1. перегрев процессора\n2. нехватка места на диске\n3. сбой в работе сети"
    - "Тема:\nIT Support: инструменты разработки\n\nВопрос:\nGit не позволяет сделать commit из-за конфликта слияния. Что нужно сделать в первую очередь\n\nВарианты ответа:\n0. удалить локальный репозиторий и клонировать заново\n1. разрешить конфликт вручную и добавить файлы через git add\n2. сделать git push --force\n3. откатить последний коммит через git reset --hard"
    - "Тема:\nIT Support: диагностика сети\n\nВопрос:\nПользователь не может открыть веб-сайт, но другие сайты работают. Первый шаг диагностики\n\nВарианты ответа:\n0. перезагрузить роутер\n1. проверить доступность сайта через ping и DNS\n2. переустановить браузер\n3. сменить провайдера"
    - "Тема:\nIT Support: работа с ОС\n\nВопрос:\nКомпьютер работает медленно, диск постоянно загружен на 100%. Наиболее вероятная причина\n\nВарианты ответа:\n0. неисправность оперативной памяти\n1. фоновые процессы или устаревший HDD\n2. вирус в загрузочном секторе\n3. неправильные настройки BIOS"
  system: "Ты отвечаешь на русскоязычные тестовые вопросы по IT-поддержке. Дан вопрос и варианты ответа с нумерацией с 0. Выбери один правильный вариант. Ответь только номером варианта и текстом ответа, без объяснений."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
